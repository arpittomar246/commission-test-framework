[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short

markers =
    api: exercises the JSON API directly through the requests client
    ui: drives the browser with Playwright
    parity: checks the UI and the API agree on the same numbers
    smoke: the short set worth running on every commit
    serial: mutates shared state; do not run under xdist parallelism

filterwarnings =
    error::DeprecationWarning:app.*
