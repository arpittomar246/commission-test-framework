services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/commission.db
    volumes:
      - commission-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/stats')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  seed:
    build: .
    environment:
      DB_PATH: /data/commission.db
    volumes:
      - commission-data:/data
    command: ["python", "-m", "app.seed"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  commission-data:
