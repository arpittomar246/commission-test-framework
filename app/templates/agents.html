{% extends "base.html" %}

{% block topbar %}
<button type="button" data-testid="new-button" onclick="openAgentModal()"
        class="rounded-md bg-accent-500 px-3.5 py-2 text-sm font-semibold text-white hover:bg-accent-600">
  New Agent
</button>
{% endblock %}

{% block content %}
<section class="rounded-xl border border-slate-200 bg-white">

  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 px-5 py-4">
    <input type="search" placeholder="Search agents..." data-testid="agent-search-input"
           class="w-72 rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-accent-500 focus:ring-1 focus:ring-accent-500">
    <button type="button" data-testid="add-agent-button" onclick="openAgentModal()"
            class="rounded-md bg-accent-500 px-3.5 py-2 text-sm font-semibold text-white hover:bg-accent-600">
      Add Agent
    </button>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-sm" data-testid="agents-table">
      <thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-500">
        <tr>
          <th class="px-5 py-3 font-semibold"><button type="button" data-testid="agents-sort-name" onclick="sortBy('name')" class="hover:text-slate-800">Name</button></th>
          <th class="px-5 py-3 font-semibold"><button type="button" data-testid="agents-sort-email" onclick="sortBy('email')" class="hover:text-slate-800">Email</button></th>
          <th class="px-5 py-3 font-semibold"><button type="button" data-testid="agents-sort-join-date" onclick="sortBy('join_date')" class="hover:text-slate-800">Join Date</button></th>
          <th class="px-5 py-3 font-semibold"><button type="button" data-testid="agents-sort-months-active" onclick="sortBy('months_active')" class="hover:text-slate-800">Months Active</button></th>
          <th class="px-5 py-3 font-semibold">Guarantee Status</th>
          <th class="px-5 py-3 font-semibold">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100" data-testid="agents-table-body"></tbody>
    </table>
  </div>

  <div class="hidden px-5 py-16 text-center" data-testid="agents-empty-state">
    <p class="text-sm font-semibold text-slate-700">No agents yet</p>
    <p class="mt-1 text-sm text-slate-500">Add your first agent to start tracking commission.</p>
    <button type="button" data-testid="agents-empty-cta" onclick="openAgentModal()"
            class="mt-4 rounded-md bg-accent-500 px-3.5 py-2 text-sm font-semibold text-white hover:bg-accent-600">
      Add Agent
    </button>
  </div>

  <div class="hidden px-5 py-16 text-center" data-testid="agents-no-results">
    <p class="text-sm font-semibold text-slate-700">No agents match your search</p>
  </div>
</section>

<!-- create-agent modal -->
<div class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-900/40 p-4"
     data-testid="agent-modal" data-open="false">
  <div class="w-full max-w-md rounded-xl bg-white shadow-xl">
    <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
      <h2 class="text-sm font-semibold">Add Agent</h2>
      <button type="button" data-testid="agent-modal-close" onclick="closeModal('agent-modal')"
              class="text-slate-400 hover:text-slate-700">&times;</button>
    </div>

    <form class="space-y-4 px-5 py-5" data-testid="agent-form" onsubmit="submitAgent(event)">
      <div>
        <label class="mb-1 block text-xs font-semibold text-slate-600">Name</label>
        <input type="text" data-testid="agent-name-input"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-accent-500 focus:ring-1 focus:ring-accent-500">
        <p class="mt-1 hidden text-xs font-medium text-red-600" data-error data-testid="agent-name-error"></p>
      </div>

      <div>
        <label class="mb-1 block text-xs font-semibold text-slate-600">Email</label>
        <input type="text" data-testid="agent-email-input"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-accent-500 focus:ring-1 focus:ring-accent-500">
        <p class="mt-1 hidden text-xs font-medium text-red-600" data-error data-testid="agent-email-error"></p>
      </div>

      <div>
        <label class="mb-1 block text-xs font-semibold text-slate-600">Join Date</label>
        <input type="date" data-testid="agent-join-date-input"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-accent-500 focus:ring-1 focus:ring-accent-500">
        <p class="mt-1 hidden text-xs font-medium text-red-600" data-error data-testid="agent-join-date-error"></p>
      </div>

      <p class="hidden rounded-md bg-red-50 px-3 py-2 text-xs font-medium text-red-700"
         data-error data-testid="agent-form-error"></p>

      <div class="flex justify-end gap-2 pt-1">
        <button type="button" data-testid="agent-cancel-button" onclick="closeModal('agent-modal')"
                class="rounded-md border border-slate-300 px-3.5 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">
          Cancel
        </button>
        <button type="submit" data-testid="agent-submit-button"
                class="rounded-md bg-accent-500 px-3.5 py-2 text-sm font-semibold text-white hover:bg-accent-600">
          Create Agent
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let agents = [];
let sortKey = null;
let sortDir = 1;

function openAgentModal() {
  clearFieldErrors('agent-modal');
  document.querySelector('[data-testid="agent-name-input"]').value = '';
  document.querySelector('[data-testid="agent-email-input"]').value = '';
  document.querySelector('[data-testid="agent-join-date-input"]').value = todayISO();
  openModal('agent-modal');
}

function sortBy(key) {
  sortDir = sortKey === key ? -sortDir : 1;
  sortKey = key;
  render();
}

function visibleAgents() {
  const term = document.querySelector('[data-testid="agent-search-input"]').value.trim().toLowerCase();
  let rows = agents.filter(
    (a) => !term || a.name.toLowerCase().includes(term) || a.email.toLowerCase().includes(term)
  );
  if (sortKey) {
    rows = [...rows].sort((a, b) => {
      const x = a[sortKey];
      const y = b[sortKey];
      return (x < y ? -1 : x > y ? 1 : 0) * sortDir;
    });
  }
  return rows;
}

function render() {
  const body = document.querySelector('[data-testid="agents-table-body"]');
  const table = document.querySelector('[data-testid="agents-table"]');
  const rows = visibleAgents();

  table.classList.toggle('hidden', agents.length === 0);
  document.querySelector('[data-testid="agents-empty-state"]').classList.toggle('hidden', agents.length !== 0);
  document
    .querySelector('[data-testid="agents-no-results"]')
    .classList.toggle('hidden', !(agents.length > 0 && rows.length === 0));

  body.innerHTML = rows
    .map(
      (a) => `
      <tr data-testid="agent-row-${a.id}" class="hover:bg-slate-50">
        <td class="px-5 py-3 font-medium" data-testid="agent-cell-name-${a.id}">${escapeHtml(a.name)}</td>
        <td class="px-5 py-3 text-slate-600" data-testid="agent-cell-email-${a.id}">${escapeHtml(a.email)}</td>
        <td class="px-5 py-3 text-slate-600" data-testid="agent-cell-join-date-${a.id}">${fmtDate(a.join_date)}</td>
        <td class="px-5 py-3 tabular-nums" data-testid="agent-cell-months-active-${a.id}">${a.months_active}</td>
        <td class="px-5 py-3">${guaranteeBadge(a.guarantee_active, `guarantee-badge-${a.id}`)}</td>
        <td class="px-5 py-3">
          <a href="/commission?agent_id=${a.id}" data-testid="agent-commission-link-${a.id}"
             class="text-sm font-semibold text-accent-600 hover:text-accent-700">View commission</a>
        </td>
      </tr>`
    )
    .join('');
}

async function loadAgents() {
  agents = await API.get('/api/agents');
  render();
}

async function submitAgent(event) {
  event.preventDefault();
  clearFieldErrors('agent-modal');

  const name = document.querySelector('[data-testid="agent-name-input"]').value.trim();
  const email = document.querySelector('[data-testid="agent-email-input"]').value.trim();
  const joinDate = document.querySelector('[data-testid="agent-join-date-input"]').value;

  let valid = true;
  if (!name) { showFieldError('agent-name-error', 'Name is required'); valid = false; }
  if (!email) { showFieldError('agent-email-error', 'Email is required'); valid = false; }
  else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
    showFieldError('agent-email-error', 'Enter a valid email address'); valid = false;
  }
  if (!joinDate) { showFieldError('agent-join-date-error', 'Join date is required'); valid = false; }
  if (!valid) return;

  try {
    const created = await API.post('/api/agents', { name, email, join_date: joinDate });
    closeModal('agent-modal');
    await loadAgents();
    toast(`Agent ${created.name} created`);
  } catch (err) {
    showFieldError('agent-form-error', err.message);
    toast(err.message, 'error');
  }
}

document
  .querySelector('[data-testid="agent-search-input"]')
  .addEventListener('input', render);

loadAgents().catch((e) => toast(e.message, 'error'));
</script>
{% endblock %}
